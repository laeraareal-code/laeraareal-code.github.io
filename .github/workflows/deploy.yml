name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Pinning to ubuntu-24.04 removes the migration notice banner
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Upgraded to v7 to resolve Node 20 deprecation and git warnings
      - uses: actions/checkout@v7

      # Upgraded to v5 to match modern runner defaults
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # Upgraded to v5 to match modern runner defaults
      - id: deployment
        uses: actions/deploy-pages@v5
